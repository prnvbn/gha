name: Homebrew release
description: Update a Homebrew formula or cask from a stable GitHub release.
inputs:
  app-id:
    description: GitHub App ID
    required: true
  app-private-key:
    description: GitHub App private key
    required: true
  tap:
    description: Homebrew tap repository
    default: prnvbn/homebrew-tap
  version:
    description: Manual version override, otherwise use the latest stable release
    default: ""
  package-type:
    description: Package type, formula or cask
    default: formula
  cask:
    description: "Homebrew cask token"
    required: false
  asset:
    description: "Release asset filename with optional {version} placeholder"
    required: false
  app-name:
    description: "App name without .app"
    required: false
  description:
    description: "Short app description"
    required: false
  homepage:
    description: "App homepage URL"
    required: false
  macos:
    description: "Minimum macOS codename"
    default: "tahoe"
  arch:
    description: "Supported architecture: arm64 or intel"
    default: "arm64"
runs:
  using: composite
  steps:
    - name: Check secrets
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: |
        missing=0
        if [[ -z "${APP_ID//[[:space:]]/}" ]]; then
          echo "::error::Configure GH_APP_ID and pass it as app-id."
          missing=1
        fi
        if [[ -z "${APP_PRIVATE_KEY//[[:space:]]/}" ]]; then
          echo "::error::Configure GH_APP_PRIVATE_KEY and pass it as app-private-key."
          missing=1
        fi
        exit "$missing"

    - name: Select release
      id: release
      uses: actions/github-script@v9
      env:
        PACKAGE_TYPE: ${{ inputs.package-type }}
        ASSET: ${{ inputs.asset }}
        VERSION: ${{ inputs.version }}
        TAP: ${{ inputs.tap }}
      with:
        script: |
          if (!['formula', 'cask'].includes(process.env.PACKAGE_TYPE)) throw new Error('package-type must be formula or cask');
          const [owner, repo, extra] = process.env.TAP.split('/');
          if (!owner || !repo || extra) throw new Error('tap must be owner/repository');
          core.setOutput('owner', owner);
          core.setOutput('repo', repo);
          const event = context.payload.release;
          if (event?.draft || event?.prerelease) return;
          const version = context.eventName === 'workflow_dispatch' ? process.env.VERSION.trim() : '';
          let release;
          try {
            release = version
              ? (await github.rest.repos.getReleaseByTag({ ...context.repo, tag: version.startsWith('v') ? version : `v${version}` })).data
              : (await github.rest.repos.getLatestRelease(context.repo)).data;
          } catch (error) {
            if (error.status === 404 && !version && context.eventName !== 'workflow_dispatch') return;
            throw error;
          }
          if (release.draft || release.prerelease) throw new Error('Select a stable release');
          if (event && release.id !== event.id) {
            core.info('Skipping release because it is not marked as latest');
            return;
          }
          if (process.env.PACKAGE_TYPE === 'cask') {
            if (!/^v\d+\.\d+\.\d+$/.test(release.tag_name)) throw new Error('Expected vMAJOR.MINOR.PATCH tag');
            const asset = release.assets.find(asset => asset.name === process.env.ASSET.replaceAll('{version}', release.tag_name.slice(1)));
            if (!asset) throw new Error('Release is missing the requested asset');
            core.setOutput('url', asset.browser_download_url);
          }
          core.setOutput('tag', release.tag_name);

    - name: Create tap token
      if: steps.release.outputs.tag != ''
      id: token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.release.outputs.owner }}
        repositories: ${{ steps.release.outputs.repo }}
        permission-contents: write

    - name: Update formula
      if: steps.release.outputs.tag != '' && inputs.package-type == 'formula'
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        TAP: ${{ inputs.tap }}
        TAG: ${{ steps.release.outputs.tag }}
      with:
        github-token: ${{ steps.token.outputs.token }}
        script: |
          const update = require(`${process.env.ACTION_PATH}/update-formula.cjs`);
          await update({ github, core, context });

    - name: Update cask
      if: steps.release.outputs.tag != '' && inputs.package-type == 'cask'
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        TAP: ${{ inputs.tap }}
        CASK: ${{ inputs.cask }}
        APP_NAME: ${{ inputs.app-name }}
        DESCRIPTION: ${{ inputs.description }}
        HOMEPAGE: ${{ inputs.homepage }}
        MACOS: ${{ inputs.macos }}
        ARCH: ${{ inputs.arch }}
        TAG: ${{ steps.release.outputs.tag }}
        ASSET_URL: ${{ steps.release.outputs.url }}
      with:
        github-token: ${{ steps.token.outputs.token }}
        script: |
          const update = require(`${process.env.ACTION_PATH}/update-cask.cjs`);
          await update({ github, core });
